name: UAPPKitDemo

options:
  deploymentTarget:
    iOS: "18.0"
    macOS: "14.0"
  localPackagesGroup: Swift Package Dependencies

packages:
  UAPPKit:
    path: ../..

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  UAPPKitDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: UAPPKit
        product: UAPPKit
    info:
      path: Resources/Info.plist
      properties:
        NSCameraUsageDescription: A câmera permite tirar uma foto para o seu perfil.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - uappkit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.renatoferraz.UAPPKitDemo
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: UAPPKit
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  # App nativo para Mac: abre as telas do kit em janelas próprias e usa o menu Ajuda.
  UAPPKitDemoMac:
    type: application
    platform: macOS
    sources:
      - path: MacSources
      - path: Sources/Mock
      - path: Sources/Account/DemoAccountModel.swift
      - path: Resources/UAPPKit.icon
      - path: Resources/Assets.xcassets
    dependencies:
      - package: UAPPKit
        product: UAPPKit
    info:
      path: MacResources/Info.plist
      properties:
        CFBundleDisplayName: UAPPKit Demo
        LSApplicationCategoryType: public.app-category.developer-tools
        # Sem idiomas declarados, o macOS trata o app como só em inglês e o kit seguiria em inglês.
        CFBundleDevelopmentRegion: pt-BR
        CFBundleAllowMixedLocalizations: true
        CFBundleLocalizations: [pt-BR, en, de, es, fr, hi, it, ja, ko, pl, vi, zh-Hans, zh-Hant]
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - uappkit
    entitlements:
      path: MacResources/UAPPKitDemoMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.renatoferraz.UAPPKitDemoMac
        # Assinatura estável entre builds; sem equipe, o macOS trata cada build como outro app.
        DEVELOPMENT_TEAM: 5TQQ84X3M3
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: UAPPKit Demo
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: UAPPKit
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: YES

  UAPPKitDemoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests
    dependencies:
      - target: UAPPKitDemo
      - package: UAPPKit
        product: UAPPKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  UAPPKitDemo:
    build:
      targets:
        UAPPKitDemo: all
    run:
      config: Debug
    test:
      targets:
        - UAPPKitDemoTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  UAPPKitDemoMac:
    build:
      targets:
        UAPPKitDemoMac: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
