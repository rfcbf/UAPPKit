name: UAPPKitDemo

options:
  deploymentTarget:
    iOS: "18.0"
  localPackagesGroup: Swift Package Dependencies

packages:
  UAPPKit:
    path: ../..

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  UAPPKitDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: UAPPKit
        product: UAPPKit
    info:
      path: Resources/Info.plist
      properties:
        NSCameraUsageDescription: A câmera permite tirar uma foto para o seu perfil.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - uappkit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.renatoferraz.UAPPKitDemo
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: UAPPKit
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  UAPPKitDemoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests
    dependencies:
      - target: UAPPKitDemo
      - package: UAPPKit
        product: UAPPKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  UAPPKitDemo:
    build:
      targets:
        UAPPKitDemo: all
    run:
      config: Debug
    test:
      targets:
        - UAPPKitDemoTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
