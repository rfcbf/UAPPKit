name: Swift Package CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Validate package manifest
        run: swift package dump-package

      - name: Build debug
        run: swift build

      - name: Build release
        run: swift build -c release

      - name: Run tests
        run: swift test

      - name: Build iOS Simulator target
        run: xcodebuild -scheme UAPPKit -destination 'generic/platform=iOS Simulator' build
