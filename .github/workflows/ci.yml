name: CI

# O runner macOS consome dez minutos da franquia a cada minuto executado. Por
# isso a CI ignora mudanças só de documentação e cancela a execução anterior
# do mesmo Pull Request. O CHANGELOG.md continua disparando a CI porque a tag
# de release depende da CI verde na main.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!Documentation/**'
      - '!**/*.md'
      - '!LICENSE'
      - 'CHANGELOG.md'
  pull_request:
    paths:
      - '**'
      - '!Documentation/**'
      - '!**/*.md'
      - '!LICENSE'
      - 'CHANGELOG.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: brew install swiftformat swiftlint xcodegen

      - name: Check formatting
        run: swiftformat . --lint

      - name: Lint
        run: swiftlint lint --strict

      - name: Validate package manifest
        run: swift package dump-package

      # O build system "swiftbuild" compila o Localizable.xcstrings; o nativo só
      # copia o arquivo e os testes de localização falham. O `swift test` já
      # compila o pacote em debug, então só o build de release roda à parte.
      - name: Build and test package
        run: |
          swift build --build-system swiftbuild -c release
          swift test --build-system swiftbuild --enable-code-coverage

      - name: Check SDK coverage
        env:
          UAPP_SWIFT_BUILD_FLAGS: --build-system swiftbuild
        run: bash Scripts/check-coverage.sh

      - name: Regenerate demo project
        working-directory: .Examples/UAPPKitDemo
        run: xcodegen generate

      - name: Check generated project is current
        run: git diff --exit-code -- .Examples/UAPPKitDemo/UAPPKitDemo.xcodeproj/project.pbxproj

      # O ícone UAPPKit.icon foi criado no Icon Composer do Xcode 27 e o actool
      # do Xcode 26 não consegue abri-lo. Até existir runner com Xcode 27, a CI
      # compila o Demo sem o ícone; o restante do build é validado normalmente.
      - name: Build demo for iOS Simulator
        run: >-
          xcodebuild -quiet
          -project .Examples/UAPPKitDemo/UAPPKitDemo.xcodeproj
          -scheme UAPPKitDemo
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          EXCLUDED_SOURCE_FILE_NAMES=UAPPKit.icon
          ASSETCATALOG_COMPILER_APPICON_NAME=
          build
