included:
  - Sources
  - Tests
  - Examples/UAPPKitDemo/Sources

excluded:
  - .build
  - DerivedData
  - Examples/UAPPKitDemo/UAPPKitDemo.xcodeproj

only_rules:
  - trailing_whitespace
  - unused_import
  - vertical_whitespace
  - file_length
  - type_body_length
  - function_body_length

file_length:
  warning: 900
  error: 1200

type_body_length:
  warning: 500
  error: 700

function_body_length:
  warning: 80
  error: 120

reporter: "github-actions-logging"
